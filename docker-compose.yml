services:
  # ─── Service-owned Databases ─────────────────────────────────────────────────
  backend-postgres:
    image: pgvector/pgvector:pg16
    container_name: petcare-backend-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${BACKEND_DB_NAME:-petcare}
      POSTGRES_USER: ${BACKEND_DB_USER:-petcare}
      POSTGRES_PASSWORD: ${BACKEND_DB_PASSWORD:-petcare123}
    ports:
      - "5432:5432"
    volumes:
      - backend_postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BACKEND_DB_USER:-petcare} -d ${BACKEND_DB_NAME:-petcare}"]
      interval: 10s
      timeout: 5s
      retries: 5

  payment-postgres:
    image: postgres:16-alpine
    container_name: petcare-payment-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PAYMENT_DB_NAME:-petcare_payment}
      POSTGRES_USER: ${PAYMENT_DB_USER:-petcare_payment}
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD:-petcare_payment123}
    ports:
      - "5433:5432"
    volumes:
      - payment_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PAYMENT_DB_USER:-petcare_payment} -d ${PAYMENT_DB_NAME:-petcare_payment}"]
      interval: 10s
      timeout: 5s
      retries: 5

  notification-postgres:
    image: postgres:16-alpine
    container_name: petcare-notification-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${NOTIFICATION_DB_NAME:-petcare_notification}
      POSTGRES_USER: ${NOTIFICATION_DB_USER:-petcare_notification}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-petcare_notification123}
    ports:
      - "5434:5432"
    volumes:
      - notification_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NOTIFICATION_DB_USER:-petcare_notification} -d ${NOTIFICATION_DB_NAME:-petcare_notification}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Cache ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: petcare-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Message Broker ──────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: petcare-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-petcare}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-petcare123}
    ports:
      - "5672:5672"
      - "15672:15672"   # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ─── Backend ─────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    container_name: petcare-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_HOST: backend-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${BACKEND_DB_NAME:-petcare}
      POSTGRES_USER: ${BACKEND_DB_USER:-petcare}
      POSTGRES_PASSWORD: ${BACKEND_DB_PASSWORD:-petcare123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-petcare}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-petcare123}
      JWT_SECRET: ${JWT_SECRET:-your-256-bit-secret-key-change-in-production}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      AI_AGENT_URL: http://ai-agent:8001
      AI_RAG_URL: http://ai-rag:8002
      AI_VISION_URL: http://ai-vision:8003
    ports:
      - "8080:8080"
    depends_on:
      backend-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  payment-service:
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile
    container_name: petcare-payment-service
    restart: unless-stopped
    environment:
      PAYMENT_DB_HOST: payment-postgres
      PAYMENT_DB_PORT: 5432
      PAYMENT_DB_NAME: ${PAYMENT_DB_NAME:-petcare_payment}
      PAYMENT_DB_USER: ${PAYMENT_DB_USER:-petcare_payment}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:-petcare_payment123}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-petcare}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-petcare123}
    ports:
      - "8082:8082"
    depends_on:
      payment-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: petcare-notification-service
    restart: unless-stopped
    environment:
      NOTIFICATION_DB_HOST: notification-postgres
      NOTIFICATION_DB_PORT: 5432
      NOTIFICATION_DB_NAME: ${NOTIFICATION_DB_NAME:-petcare_notification}
      NOTIFICATION_DB_USER: ${NOTIFICATION_DB_USER:-petcare_notification}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-petcare_notification123}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-petcare}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-petcare123}
      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    ports:
      - "8083:8083"
    depends_on:
      notification-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ─── Web Frontend ─────────────────────────────────────────────────────────────
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: petcare-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8080/api/v1

  # ─── AI Services ──────────────────────────────────────────────────────────────
  ai-agent:
    build:
      context: ./ai/agent
      dockerfile: Dockerfile
    container_name: petcare-ai-agent
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://${BACKEND_DB_USER:-petcare}:${BACKEND_DB_PASSWORD:-petcare123}@backend-postgres:5432/${BACKEND_DB_NAME:-petcare}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-stub}
      BACKEND_URL: http://backend:8080/api/v1
    depends_on:
      backend-postgres:
        condition: service_healthy

  ai-rag:
    build:
      context: ./ai/rag
      dockerfile: Dockerfile
    container_name: petcare-ai-rag
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: postgresql://${BACKEND_DB_USER:-petcare}:${BACKEND_DB_PASSWORD:-petcare123}@backend-postgres:5432/${BACKEND_DB_NAME:-petcare}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-stub}
    depends_on:
      backend-postgres:
        condition: service_healthy

  ai-vision:
    build:
      context: ./ai/vision
      dockerfile: Dockerfile
    container_name: petcare-ai-vision
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-stub}

  ai-recommendation:
    build:
      context: ./ai/recommendation
      dockerfile: Dockerfile
    container_name: petcare-ai-recommendation
    restart: unless-stopped
    ports:
      - "8004:8004"
    environment:
      DATABASE_URL: postgresql://${BACKEND_DB_USER:-petcare}:${BACKEND_DB_PASSWORD:-petcare123}@backend-postgres:5432/${BACKEND_DB_NAME:-petcare}
    depends_on:
      backend-postgres:
        condition: service_healthy

  # ─── Observability ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: petcare-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'

  grafana:
    image: grafana/grafana:latest
    container_name: petcare-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin123}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus

volumes:
  backend_postgres_data:
  payment_postgres_data:
  notification_postgres_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: petcare-network
