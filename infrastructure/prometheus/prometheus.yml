global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'petcare-backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['backend:8080']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'backend'

  - job_name: 'ai-agent'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['ai-agent:8001']

  - job_name: 'ai-rag'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['ai-rag:8002']

  - job_name: 'ai-vision'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['ai-vision:8003']

  - job_name: 'ai-recommendation'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['ai-recommendation:8004']

  - job_name: 'ai-forecasting'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['ai-forecasting:8005']

  - job_name: 'ai-optimization'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['ai-optimization:8006']

  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
