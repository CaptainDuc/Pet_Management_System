spring:
  application:
    name: pet-care-platform

  # ─── DataSource ──────────────────────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:petcare}
    username: ${POSTGRES_USER:petcare}
    password: ${POSTGRES_PASSWORD:petcare123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ─── JPA / Hibernate ─────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_batch_fetch_size: 100
        jdbc:
          batch_size: 50

  # ─── Flyway ──────────────────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  # ─── Redis ───────────────────────────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 1

  # ─── RabbitMQ ────────────────────────────────────────────────────────────────
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:petcare}
    password: ${RABBITMQ_PASSWORD:petcare123}
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          max-interval: 10000
          multiplier: 2

  # ─── Cache ───────────────────────────────────────────────────────────────────
  cache:
    type: redis
    redis:
      time-to-live: 3600000

# ─── Server ────────────────────────────────────────────────────────────────────
server:
  port: 8080
  servlet:
    context-path: /
  compression:
    enabled: true

# ─── SpringDoc / Swagger ───────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
  default-produces-media-type: application/json

# ─── JWT ───────────────────────────────────────────────────────────────────────
app:
  jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-key-change-this-in-production-must-be-at-least-256-bits}
    expiration: ${JWT_EXPIRATION:86400000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
    clock-skew-seconds: ${JWT_CLOCK_SKEW_SECONDS:30}
  security:
    cors:
      # Explicit origins. "*" is tolerated for local development but logs a warning.
      allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
      allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}
  ai:
    agent-url: ${AI_AGENT_URL:http://localhost:8001}
    rag-url: ${AI_RAG_URL:http://localhost:8002}
    vision-url: ${AI_VISION_URL:http://localhost:8003}
    recommendation-url: ${AI_RECOMMENDATION_URL:http://localhost:8004}
    forecasting-url: ${AI_FORECASTING_URL:http://localhost:8005}
    optimization-url: ${AI_OPTIMIZATION_URL:http://localhost:8006}

# ─── Actuator ──────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,env
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

# ─── Logging ───────────────────────────────────────────────────────────────────
logging:
  level:
    com.petcare.platform: DEBUG
    org.springframework.security: INFO
    org.springframework.amqp: INFO
    org.hibernate.SQL: INFO
