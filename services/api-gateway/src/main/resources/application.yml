server:
  port: ${GATEWAY_PORT:8000}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # Cả gateway và các service đều có thể thêm header CORS, giữ lại một bản để trình duyệt không báo lỗi trùng
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          "[/**]":
            allowedOriginPatterns: "${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost,http://localhost:*,http://127.0.0.1,http://127.0.0.1:*}"
            allowedMethods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      routes:
        - id: payment-service
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/payments/**,/api/v1/orders/**,/api/v1/webhooks/**
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/notifications/**
        - id: core-backend
          uri: ${CORE_SERVICE_URL:http://localhost:8080}
          predicates:
            - Path=/api/v1/**,/api-docs,/api-docs/**,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
