spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://${PAYMENT_DB_HOST:localhost}:${PAYMENT_DB_PORT:5433}/${PAYMENT_DB_NAME:petcare_payment}
    username: ${PAYMENT_DB_USER:petcare_payment}
    password: ${PAYMENT_DB_PASSWORD:petcare_payment123}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:petcare}
    password: ${RABBITMQ_PASSWORD:petcare123}

server:
  port: ${PAYMENT_SERVICE_PORT:8082}

app:
  core:
    base-url: ${CORE_SERVICE_URL:http://localhost:8080}
  internal:
    api-key: ${INTERNAL_API_KEY:petcare_internal_dev_key}
  outbox:
    poll-interval-ms: ${PAYMENT_OUTBOX_POLL_MS:2000}
  sepay:
    api-key: ${SEPAY_API_KEY:sepay_local_dev_key}
    bank-account-number: ${BANK_ACCOUNT_NUMBER:0123456789}
    bank-code: ${BANK_CODE:MB}
    bank-account-name: ${BANK_ACCOUNT_NAME:PETCARE SERVICE}
    payment-prefix: ${PAYMENT_PREFIX:DH}
    qr-base-url: ${SEPAY_QR_BASE_URL:https://qr.sepay.vn/img}
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
